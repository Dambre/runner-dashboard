<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2129;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --orange: #db6d28;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* Header */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .header-left { display: flex; align-items: center; gap: 0.75rem; }

  .header h1 {
    font-size: 1.125rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .status-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); }

  .header-meta {
    font-size: 0.775rem;
    color: var(--muted);
    display: flex;
    gap: 1.25rem;
    align-items: center;
  }

  /* Stats row */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    background: var(--bg);
    padding: 1rem 1.25rem;
    text-align: center;
  }

  .stat-value {
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .stat-value.running { color: var(--accent); }
  .stat-value.pending { color: var(--yellow); }
  .stat-value.completed { color: var(--green); }
  .stat-value.failed { color: var(--red); }

  .stat-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 0.15rem;
  }

  /* Main layout */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  /* Section */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .section-header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .section-header .count {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 0 0.45rem;
    border-radius: 99px;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text);
  }

  /* Table */
  .table { width: 100%; border-collapse: collapse; }
  .table th {
    text-align: left;
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .table td {
    padding: 0.55rem 1rem;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .table tr:last-child td { border-bottom: none; }

  .table .mono {
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 0.8rem;
  }

  /* Badges */
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    padding: 0.1rem 0.5rem;
    border-radius: 99px;
    font-weight: 500;
  }
  .badge-running    { background: rgba(88,166,255,0.15); color: var(--accent); }
  .badge-completed  { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge-failed     { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge-pending    { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .badge-clarifying { background: rgba(188,140,255,0.15); color: var(--purple); }

  .badge-issue    { background: rgba(63,185,80,0.12); color: var(--green); }
  .badge-pr_fix   { background: rgba(88,166,255,0.12); color: var(--accent); }
  .badge-workflow  { background: rgba(188,140,255,0.12); color: var(--purple); }

  .error-msg {
    color: var(--red);
    font-size: 0.8rem;
    max-width: 250px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty {
    padding: 1.5rem 1rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .time {
    color: var(--muted);
    font-size: 0.8rem;
    white-space: nowrap;
  }

  .duration { color: var(--orange); font-weight: 500; }

  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.3rem 0.65rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: border-color 0.15s, color 0.15s;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .phase-badge {
    font-size: 0.75rem;
    padding: 0.15rem 0.55rem;
    border-radius: 99px;
    background: rgba(88,166,255,0.12);
    color: var(--accent);
    font-weight: 500;
  }

  .ref-link, .pr-link {
    color: var(--accent);
    text-decoration: none;
  }
  .ref-link:hover, .pr-link:hover { text-decoration: underline; }

  /* Events */
  .event-row { display: flex; gap: 0.75rem; align-items: baseline; }
  .event-row .event-type {
    font-size: 0.7rem;
    color: var(--muted);
    min-width: 55px;
    text-align: right;
    flex-shrink: 0;
  }
  .event-row .event-name {
    font-weight: 500;
    font-size: 0.85rem;
  }
  .event-row .event-msg {
    color: var(--muted);
    font-size: 0.825rem;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }

  @media (max-width: 700px) {
    .main { padding: 1rem; gap: 1rem; }
    .header { padding: 0.75rem 1rem; }
    .table td, .table th { padding: 0.4rem 0.6rem; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
  <div id="app">
    <div class="loading">Loading dashboard&hellip;</div>
  </div>

<script>
const REFRESH_INTERVAL = 60_000; // 1 minute
let lastUpdated = null;

function tickUpdatedTime() {
  const el = document.getElementById('updated-ago');
  if (el && lastUpdated) el.textContent = 'Updated ' + timeAgo(lastUpdated);
  const dot = document.querySelector('.status-dot');
  if (dot && lastUpdated) {
    const stale = (Date.now() - new Date(lastUpdated)) > 5 * 60 * 1000;
    dot.className = 'status-dot ' + (stale ? 'offline' : 'online');
  }
}

async function loadAndRender() {
  const app = document.getElementById('app');
  let data;

  try {
    const r = await fetch('data/state.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.statusText);
    data = await r.json();
  } catch (e) {
    app.innerHTML = `<div class="loading">Failed to load: ${esc(e.message)}</div>`;
    return;
  }

  const svc = data.service || {};
  const stats = data.stats || {};
  lastUpdated = data.updated;

  app.innerHTML = `
    ${renderHeader(svc, data.updated)}
    ${renderStats(stats)}
    <div class="main">
      ${(data.running || []).length ? renderRunning(data.running) : ''}
      ${(data.pending || []).length ? renderPending(data.pending) : ''}
      ${renderRecent(data.recent || [])}
      ${renderEvents(data.events || [])}
    </div>
  `;

  function renderHeader(svc, updated) {
    const updatedStr = updated ? timeAgo(updated) : 'unknown';
    const stale = updated ? (Date.now() - new Date(updated)) > 5 * 60 * 1000 : true;
    const dotCls = stale ? 'offline' : 'online';
    const nextRun = svc.next_run && svc.next_run !== 'n/a'
      ? `Next: ${formatTime(svc.next_run)}` : '';
    return `<div class="header">
      <div class="header-left">
        <h1>Runner Dashboard</h1>
        <span class="status-dot ${dotCls}" title="${stale ? 'Last update >5min ago' : 'Online'}"></span>
      </div>
      <div class="header-meta">
        ${nextRun ? `<span>${nextRun}</span>` : ''}
        <span id="updated-ago">Updated ${updatedStr}</span>
        <button class="refresh-btn" onclick="refresh()" title="Refresh now">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 1v5h5"/><path d="M1 6a7 7 0 0 1 12.9-2.5M15 15v-5h-5"/><path d="M15 10a7 7 0 0 1-12.9 2.5"/>
          </svg>
        </button>
      </div>
    </div>`;
  }

  function renderStats(s) {
    return `<div class="stats">
      <div class="stat"><div class="stat-value running">${s.running || 0}</div><div class="stat-label">Running</div></div>
      <div class="stat"><div class="stat-value pending">${s.pending || 0}</div><div class="stat-label">Pending</div></div>
      <div class="stat"><div class="stat-value completed">${s.completed || 0}</div><div class="stat-label">Completed</div></div>
      <div class="stat"><div class="stat-value failed">${s.failed || 0}</div><div class="stat-label">Failed</div></div>
    </div>`;
  }

  function renderRunning(rows) {
    return `<div class="section">
      <div class="section-header">Running Sessions <span class="count">${rows.length}</span></div>
      ${rows.length === 0
        ? '<div class="empty">No active sessions</div>'
        : `<table class="table"><thead><tr>
            <th>Type</th><th>Repo</th><th>Ref</th><th>Phase</th><th>Started</th><th>Duration</th>
          </tr></thead><tbody>${rows.map(r => `<tr>
            <td>${typeBadge(r.type)}</td>
            <td>${esc(r.repo)}</td>
            <td class="mono">${refLink(r.ref, r.url)}</td>
            <td><span class="phase-badge">${esc(r.phase || 'starting')}</span></td>
            <td class="time">${formatTime(r.started_at)}</td>
            <td class="duration">${esc(r.duration || '')}</td>
          </tr>`).join('')}</tbody></table>`
      }
    </div>`;
  }

  function renderPending(rows) {
    return `<div class="section">
      <div class="section-header">Pending / Clarifying <span class="count">${rows.length}</span></div>
      ${rows.length === 0
        ? '<div class="empty">No pending items</div>'
        : `<table class="table"><thead><tr>
            <th>Type</th><th>Repo</th><th>Ref</th><th>Status</th><th>Created</th>
          </tr></thead><tbody>${rows.map(r => `<tr>
            <td>${typeBadge(r.type)}</td>
            <td>${esc(r.repo)}</td>
            <td class="mono">${refLink(r.ref, r.url)}</td>
            <td>${statusBadge(r.status)}</td>
            <td class="time">${formatTime(r.created_at)}</td>
          </tr>`).join('')}</tbody></table>`
      }
    </div>`;
  }

  function renderRecent(rows) {
    return `<div class="section">
      <div class="section-header">Recent Completed / Failed <span class="count">${rows.length}</span></div>
      ${rows.length === 0
        ? '<div class="empty">No recent runs</div>'
        : `<table class="table"><thead><tr>
            <th>Type</th><th>Repo</th><th>Ref</th><th>Status</th><th>Completed</th><th>PR</th><th>Error</th>
          </tr></thead><tbody>${rows.map(r => `<tr>
            <td>${typeBadge(r.type)}</td>
            <td>${esc(r.repo)}</td>
            <td class="mono">${refLink(r.ref, r.url)}</td>
            <td>${statusBadge(r.status)}</td>
            <td class="time">${formatTime(r.completed_at)}</td>
            <td>${r.pr_url ? `<a href="${esc(r.pr_url)}" target="_blank" class="pr-link">#${esc(r.pr_url.split('/').pop())}</a>` : ''}</td>
            <td>${r.error_message ? `<span class="error-msg" title="${esc(r.error_message)}">${esc(r.error_message)}</span>` : ''}</td>
          </tr>`).join('')}</tbody></table>`
      }
    </div>`;
  }

  function renderEvents(rows) {
    return `<div class="section">
      <div class="section-header">Recent Events <span class="count">${rows.length}</span></div>
      ${rows.length === 0
        ? '<div class="empty">No events</div>'
        : `<table class="table"><thead><tr>
            <th>Source</th><th>Event</th><th>Message</th><th>Time</th>
          </tr></thead><tbody>${rows.map(r => `<tr>
            <td>${typeBadge(r.run_type)}</td>
            <td class="mono">${esc(r.event)}</td>
            <td>${esc(r.message || '')}</td>
            <td class="time">${formatTime(r.created_at)}</td>
          </tr>`).join('')}</tbody></table>`
      }
    </div>`;
  }

  function refLink(ref, url) {
    if (url) return `<a href="${esc(url)}" target="_blank" class="ref-link">${esc(ref)}</a>`;
    return esc(ref);
  }

  function typeBadge(t) {
    return `<span class="badge badge-${esc(t)}">${esc(t)}</span>`;
  }

  function statusBadge(s) {
    return `<span class="badge badge-${esc(s)}">${esc(s)}</span>`;
  }

  function formatTime(t) {
    if (!t) return '';
    const s = t.includes('T') ? t : t.replace(' ', 'T');
    const d = new Date(s.endsWith('Z') ? s : s + 'Z');
    if (isNaN(d)) return esc(t);
    return d.toISOString().replace('.000Z', 'Z');
  }

  function timeAgo(t) {
    const d = new Date(t);
    const s = Math.floor((Date.now() - d) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = String(s ?? '');
    return d.innerHTML;
  }
}

async function refresh() {
  const btn = document.querySelector('.refresh-btn');
  if (btn) btn.classList.add('spinning');
  await loadAndRender();
  const btn2 = document.querySelector('.refresh-btn');
  if (btn2) { btn2.classList.remove('spinning'); }
}

loadAndRender();
setInterval(loadAndRender, REFRESH_INTERVAL);
setInterval(tickUpdatedTime, 10_000); // tick "Updated X ago" every 10s
</script>
</body>
</html>
